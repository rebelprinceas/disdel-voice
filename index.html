<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Portrait V55 - Ultra Stable Build</title>
    <style>
        :root {
            --bg-color: #36393f;
            --text-color: #dcddde;
            --timestamp-color: #72767d;
            --blurple: #5865f2;
            --online-green: #3ba55d;
        }

        html, body {
            margin: 0; padding: 0;
            background: #111; color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        #render-area { flex: 1; display: flex; justify-content: center; align-items: center; width: 100%; overflow: hidden; }
        #scale-wrapper { transform-origin: center center; display: flex; transition: transform 0.8s; }
        
        #render-frame {
            width: 1080px; height: 1920px;
            background: var(--bg-color);
            position: relative; display: flex; flex-direction: column;
            overflow: hidden;
        }

        #chat-scroller { flex: 1; padding: 60px 50px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; z-index: 5; scroll-behavior: smooth; }

        .msg-block { display: flex; margin-top: 45px; animation: fadeIn 0.15s; position: relative; }
        .msg-block.compact { margin-top: 8px; padding-left: 110px; }
        
        .avatar-container { position: relative; width: 95px; height: 95px; margin-right: 20px; flex-shrink: 0; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #fff; }
        .status-dot { position: absolute; bottom: 2px; right: 2px; width: 24px; height: 24px; background-color: var(--online-green); border-radius: 50%; border: 6px solid var(--bg-color); }

        .username { font-size: 42px; font-weight: bold; margin-right: 15px; } 
        .timestamp { font-size: 26px; color: var(--timestamp-color); }
        .text-content { font-size: 44px; color: var(--text-color); line-height: 1.35; word-wrap: break-word; white-space: pre-wrap; margin: 0; }

        /* Real Ratio Media Fix */
        .media-thumbnail { margin-top: 20px; border-radius: 20px; width: 100%; height: auto; border: 2px solid rgba(255,255,255,0.05); }

        #typing-box { padding: 0 115px 20px; font-size: 32px; color: var(--timestamp-color); display: none; }
        #countdown-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 30000; justify-content: center; align-items: center; font-size: 250px; font-weight: bold; color: white; }

        #overlay, .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 20000; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .modal-box { background: #2f3136; padding: 40px; border-radius: 20px; width: 85%; text-align: center; max-height: 80vh; overflow-y: auto;}
        textarea { width: 100%; height: 300px; background: #40444b; color: white; border-radius: 10px; padding: 20px; font-size: 24px; border:none; margin-bottom: 20px; }
        button { padding: 20px 40px; font-size: 24px; font-weight: bold; cursor: pointer; border-radius: 12px; border: none; background: var(--blurple); color: white; width: 100%; margin-bottom: 10px; }
        
        #status-msg { color: #faa61a; font-weight: bold; margin-bottom: 10px; font-size: 20px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="countdown-overlay">5</div>

    <div id="overlay">
        <div class="modal-box">
            <h2>📜 Script & Neural Sync V55</h2>
            <textarea id="scriptInput" placeholder="[Delulu]: This version will NOT hang!"></textarea>
            <button onclick="scanAssets()">Scan Assets & Prepare ➡️</button>
        </div>
    </div>

    <div id="asset-modal" class="modal" style="display:none;">
        <div class="modal-box">
            <h2>🖼️ Asset Setup</h2>
            <p id="status-msg">Upload your media files below:</p>
            <div id="media-list" style="margin-bottom: 20px; text-align: left;"></div>
            <button id="startBtn" onclick="initAndStart()" style="background:#3ba55d;">🚀 Start Production</button>
        </div>
    </div>

    <div id="render-area">
        <div id="scale-wrapper">
            <div id="render-frame">
                <video id="overlay-player" crossorigin="anonymous" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain; z-index:100; background:#000; display:none;" muted playsinline></video>
                <div id="chat-scroller"></div>
                <div id="typing-box"><span id="typer-name"></span> is typing...</div>
                <div style="height:180px; padding:0 50px 80px; display:flex; align-items:center;">
                    <div style="background:#40444b; width:100%; height:100px; border-radius:50px; display:flex; align-items:center; padding:0 40px; font-size:36px; color:#72767d;">Message...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const messageSound = new Audio('assets/sound/message.mp3');
        messageSound.crossOrigin = "anonymous";
        let script = [];
        let chatClock = new Date();
        const assetCache = {}; 
        const uniqueUsers = new Set();
        let lastUser = null;

        // Audio System
        let audioCtx, audioDest, audioRecorder, audioChunks = [];
        let voices = [], userVoiceConfig = {};

        function getUserColor(name) {
            const colors = ['#5865F2', '#3BA55D', '#FAA61A', '#ED4245', '#EB459E', '#A375FF', '#00AFF4'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) { hash = name.charCodeAt(i) + ((hash << 5) - hash); }
            return colors[Math.abs(hash) % colors.length];
        }

        async function loadVoices() {
            return new Promise(resolve => {
                let v = speechSynthesis.getVoices();
                if (v.length) { voices = v; resolve(); }
                else { speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); resolve(); }; }
                setTimeout(resolve, 2000); // Safety
            });
        }

        function assignVoices() {
            const azurePool = voices.filter(v => (v.name.includes('Microsoft') || v.name.includes('Neural')) && v.lang.includes('en'));
            const males = azurePool.filter(v => v.name.includes('Male') || v.name.includes('Guy'));
            const females = azurePool.filter(v => v.name.includes('Female') || v.name.includes('Aria'));
            
            let mIdx = 0, fIdx = 0;
            uniqueUsers.forEach(user => {
                const name = user.toLowerCase();
                const isFemale = (name === 'lolly' || name === 'dozey');
                const pool = isFemale ? (females.length ? females : azurePool) : (males.length ? males : azurePool);
                
                let cfg = { pitch: 1.0, rate: 1.0, voice: pool.length ? pool[(isFemale?fIdx++:mIdx++) % pool.length] : voices[0] };
                if (name === 'delulu') { cfg.pitch = 1.3; cfg.rate = 1.1; }
                if (name === 'sober') { cfg.pitch = 0.7; cfg.rate = 0.8; }
                userVoiceConfig[user] = cfg;
            });
        }

        function scanAssets() {
            const text = document.getElementById('scriptInput').value;
            script = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            uniqueUsers.clear();
            const mediaRegex = /<media:\s*(.*?)\s*>/g;
            const mediaFiles = new Set();
            script.forEach(line => {
                const userMatch = line.match(/\[(.*?)\]:/);
                if (userMatch) uniqueUsers.add(userMatch[1].trim());
                let m; while ((m = mediaRegex.exec(line)) !== null) mediaFiles.add(m[1]);
            });

            document.getElementById('overlay').style.display = 'none';
            document.getElementById('asset-modal').style.display = 'flex';
            const list = document.getElementById('media-list');
            list.innerHTML = "";
            mediaFiles.forEach(file => {
                const div = document.createElement('div');
                div.style.marginBottom = "10px";
                div.innerHTML = `<label>Upload <b>${file}</b>:</label><br><input type="file" onchange="assetCache['${file}'] = URL.createObjectURL(this.files[0])">`;
                list.appendChild(div);
            });
        }

        async function initAndStart() {
            // 1. Audio Setup
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioDest = audioCtx.createMediaStreamDestination();
                const node = audioCtx.createMediaElementSource(messageSound);
                node.connect(audioDest); node.connect(audioCtx.destination);
                
                const vidPlayer = document.getElementById('overlay-player');
                const vnode = audioCtx.createMediaElementSource(vidPlayer);
                vnode.connect(audioDest); vnode.connect(audioCtx.destination);
            }
            await audioCtx.resume();
            
            // 2. Voice Setup
            await loadVoices();
            assignVoices();
            speechSynthesis.cancel(); // Clear stuck speech

            // 3. Recorder Setup (High-Quality WebM/Ogg which never hangs)
            audioRecorder = new MediaRecorder(audioDest.stream);
            audioChunks = [];
            audioRecorder.ondataavailable = e => audioChunks.push(e.data);
            audioRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                a.download = `discord_audio_${Date.now()}.webm`; a.click();
            };

            document.getElementById('asset-modal').style.display = 'none';
            startCountdown();
        }

        function startCountdown() {
            adjustScale();
            let timer = 5;
            const overlay = document.getElementById('countdown-overlay');
            overlay.style.display = 'flex';
            const int = setInterval(() => {
                overlay.innerText = timer--;
                if (timer < 0) { clearInterval(int); overlay.style.display = 'none'; audioRecorder.start(); runChat(); }
            }, 1000);
        }

        async function runChat() {
            for (let i = 0; i < script.length; i++) {
                const line = script[i];
                const match = line.match(/\[(.*?)\]:\s*(.*)/);
                if (!match) continue;

                const user = match[1].trim();
                const content = match[2].trim();
                const mediaMatch = content.match(/<media:\s*(.*?)\s*>/);
                const isCompact = (lastUser && lastUser.toLowerCase() === user.toLowerCase());

                if (!isCompact) {
                    document.getElementById('typer-name').innerText = user;
                    document.getElementById('typing-box').style.display = 'block';
                    await new Promise(r => setTimeout(r, 800));
                    document.getElementById('typing-box').style.display = 'none';
                }

                const block = document.createElement('div');
                block.className = `msg-block ${isCompact ? 'compact' : ''}`;
                messageSound.currentTime = 0; messageSound.play();

                let html = '';
                if (!isCompact) {
                    html += `<div class="avatar-container"><img class="avatar" src="assets/pfps/${user.toLowerCase()}.png" onerror="this.src='assets/pfps/default.png'"><div class="status-dot"></div></div>`;
                    html += `<div class="msg-body"><div class="user-header"><span class="username" style="color:${getUserColor(user)}">${user}</span><span class="timestamp">Today at ${chatClock.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div>`;
                } else html += `<div class="msg-body">`;

                if (mediaMatch) {
                    html += `<img class="media-thumbnail" src="${assetCache[mediaMatch[1]] || ''}">`;
                    block.innerHTML = html + `</div>`;
                    document.getElementById('chat-scroller').appendChild(block);
                    await new Promise(r => setTimeout(r, 3000));
                } else {
                    html += `<div class="text-content">${content}</div></div>`;
                    block.innerHTML = html;
                    document.getElementById('chat-scroller').appendChild(block);
                    
                    // Direct Speech Call (No pre-caching to avoid hangs)
                    await new Promise(res => {
                        const clean = content.replace(/<media:.*?>/g, "").replace(/\.\.\./g, ", ").replace(/[^\x00-\x7F]/g, "").trim();
                        if (!clean) return res();
                        const utt = new SpeechSynthesisUtterance(clean);
                        const cfg = userVoiceConfig[user];
                        if (cfg) { utt.voice = cfg.voice; utt.pitch = cfg.pitch; utt.rate = cfg.rate; }
                        utt.onend = res; utt.onerror = res;
                        setTimeout(res, 8000); // Safety timeout
                        speechSynthesis.speak(utt);
                    });
                    await new Promise(r => setTimeout(r, 500));
                }
                document.getElementById('chat-scroller').scrollTo({ top: document.getElementById('chat-scroller').scrollHeight, behavior: 'smooth' });
                lastUser = user;
            }
            audioRecorder.stop();
        }

        function adjustScale() {
            const scale = Math.min((window.innerWidth - 20) / 1080, (window.innerHeight - 120) / 1920);
            document.getElementById('scale-wrapper').style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', adjustScale);
        adjustScale();
    </script>
</body>
</html>
